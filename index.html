<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>정자 기준점 AR 테스트</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#111}
    main{max-width:760px;margin:0 auto;padding:18px}h1{font-size:22px;margin:0 0 8px}p{line-height:1.55;color:#444;margin:0 0 14px}
    .guide{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.55}
    .diagram{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border-radius:12px;background:#f4f4f4}
    .pad{width:54px;height:54px;border:3px solid #777;background:rgba(255,255,255,.55);border-radius:5px;flex:0 0 auto}.line{height:2px;background:#aaa;flex:1;position:relative}.line:after{content:"약 2.4m";position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:12px;color:#666;white-space:nowrap}
    model-viewer{width:100%;height:58vh;min-height:390px;background:#e7e7e7;border-radius:16px;overflow:hidden}
    .ar-button{background:#111;color:#fff;border:0;border-radius:999px;padding:15px 22px;font-size:17px;font-weight:750;box-shadow:0 3px 10px rgba(0,0,0,.18)}
    .status{margin-top:12px;padding:11px 13px;background:#fff;border:1px solid #ddd;border-radius:10px;font-size:13px;color:#555}
  </style>
</head>
<body><main>
  <h1>정자 기준점 AR 테스트</h1>
  <p>정자와 함께 들어있는 두 개의 반투명 바닥 가이드를 실제 주춧돌/바닥 기준물에 겹쳐 맞춰보는 테스트입니다.</p>
  <div class="guide"><b>맞추는 방법</b><br>① AR을 실행하고 바닥을 인식시킵니다.<br>② 모델을 이동해 첫 번째 가이드를 기준물 A에 맞춥니다.<br>③ 모델을 회전해 두 번째 가이드가 기준물 B와 겹치도록 맞춥니다.<br>④ 두 가이드가 동시에 맞으면 정자의 위치와 방향도 함께 맞습니다.
    <div class="diagram"><div class="pad"></div><div class="line"></div><div class="pad"></div></div>
  </div>
  <model-viewer id="mv"
    src="https://raw.githubusercontent.com/ahnkwangsoo/floor-ar-test/main/assets/jungja_guides.glb"
    alt="정자와 두 개의 기준점 가이드"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    shadow-intensity="1"
    exposure="1">
    <button class="ar-button" slot="ar-button">AR로 보기</button>
  </model-viewer>
  <div id="status" class="status">모델 로딩 중…</div>
</main>
<script>
const mv=document.getElementById('mv');const status=document.getElementById('status');
mv.addEventListener('load',()=>status.textContent='모델 로딩 완료 · iPhone은 AR Quick Look, Android는 WebXR/Scene Viewer로 실행됩니다.');
mv.addEventListener('error',()=>status.textContent='모델을 불러오지 못했습니다.');
mv.addEventListener('ar-status',e=>status.textContent='AR 상태: '+e.detail.status);
</script></body></html>
